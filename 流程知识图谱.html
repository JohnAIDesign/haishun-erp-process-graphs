const form=document.querySelector("form");
const field=document.getElementById("password");
const button=form.querySelector("button");
const notice=form.querySelector("[role=status]");
const decode=value=>Uint8Array.from(atob(value),character=>character.charCodeAt(0));
form.addEventListener("submit",async event=>{
  event.preventDefault();
  button.disabled=true;
  notice.textContent="";
  try{
    const [salt,iv,ciphertext]=encryptedPage.map(decode);
    const secret=await crypto.subtle.importKey("raw",new TextEncoder().encode(field.value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:600000},secret,{name:"AES-GCM",length:256},false,["decrypt"]);
    const markup=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ciphertext));
    const frame=document.createElement("iframe");
    frame.title="HySum ERP 流程知识图谱";
    frame.setAttribute("sandbox","allow-scripts");
    frame.srcdoc=markup;
    document.querySelector("main").replaceWith(frame);
    frame.focus();
  }catch(error){
    notice.textContent=error.name==="OperationError"?"口令错误，请重试。":"当前浏览器无法解锁，请通过 HTTPS 链接打开。";
    field.select();
  }finally{
    button.disabled=false;
  }
});
</script>
